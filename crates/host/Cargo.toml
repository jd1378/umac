[package]
name = "umac-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["pyrowave"]
# Each codec is optional; PyroWave alone is the default. At least one is required.
# PyroWave: the vendored Metal encoder (third_party/pyrowave-metal), built by build.rs.
pyrowave = []
# VideoToolbox encoders.
h264 = []
hevc = []
mjpeg = []

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "fs"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
umac-proto = { version = "0.1.0", path = "../proto" }
umac-pyrowave-decode = { version = "=0.1.0", path = "../pyrowave-decode", default-features = false }
umac-transport = { version = "0.1.0", path = "../transport" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-graphics = { version = "=0.25.0", features = ["highsierra"] }
screencapturekit = { version = "=11.1.1", features = ["macos_15_2"] }

[build-dependencies]
cc = "=1.10.0"
