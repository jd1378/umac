[package]
name = "umac-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hex = "0.4.3"
postcard = "1.1.3"
quinn = { version = "0.11.12", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
rand = "0.10.3"
rcgen = "0.14.10"
reed-solomon-simd = "3.1.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = "1.0.229"
sha2 = "0.11.1"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tracing = "0.1.44"
umac-proto = { version = "0.1.0", path = "../proto" }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "rt-multi-thread"] }
