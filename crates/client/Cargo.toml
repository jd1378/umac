[package]
name = "umac-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "umac"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ffmpeg-next = "9.0.0"
libc = "0.2.191"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
umac-proto = { version = "0.1.0", path = "../proto" }
umac-transport = { version = "0.1.0", path = "../transport" }
url = "2.5.8"
wgpu = "30.0.1"
winit = "0.30.13"
