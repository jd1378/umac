[package]
name = "umac-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "umac"
path = "src/main.rs"

[[example]]
name = "fake_host"
required-features = ["hevc"]

[[example]]
name = "mjpeg_bench"
required-features = ["mjpeg"]

[features]
default = ["pyrowave"]
# Each codec is optional; PyroWave alone is the default (no ffmpeg, no codec drivers). At
# least one is required.
# PyroWave: the GPU compute decoder (the bitstream parser is always built).
pyrowave = ["umac-pyrowave-decode/gpu"]
# H.264 through Vulkan Video (needs a driver with H.264 decode, e.g. RPM Fusion's freeworld Mesa).
h264 = ["dep:umac-h264", "dep:ash"]
# HEVC (and H.264) through ffmpeg with VA-API and zero-copy dmabuf import.
hevc = ["dep:ffmpeg-next", "dep:ash"]
# Motion-JPEG through zune-jpeg on the CPU.
mjpeg = ["dep:zune-jpeg"]

[dependencies]
anyhow = "=1.0.104"
bytemuck = "=1.25.2"
clap = { version = "=4.6.7", features = ["derive"] }
cursor-icon = "=1.2.0"
dirs = "=7.0.0"
ffmpeg-next = { version = "=9.0.0", optional = true }
libc = "=0.2.191"
pollster = "=1.0.1"
umac-h264 = { version = "=1.0.0", path = "../h264", optional = true }
umac-pyrowave-decode = { version = "=1.0.0", path = "../pyrowave-decode", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
umac-proto = { version = "=1.0.0", path = "../proto" }
umac-transport = { version = "=1.0.0", path = "../transport" }
url = "=2.5.8"
wgpu = "=30.0.1"
winit = "=0.30.13"
zune-jpeg = { version = "=0.5.15", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "=0.38.0", optional = true }
ksni = "=0.3.7"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
raw-window-handle = "=0.6.2"
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop", "xkbcommon", "system"] }
